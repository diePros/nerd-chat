[package]
name = "sine-loco-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sine-loco-core = { path = "../crates/core" }
sine-loco-store = { path = "../crates/store" }
sine-loco-chat = { path = "../crates/chat" }
sine-loco-exchange = { path = "../crates/exchange" }
sine-loco-strip = { path = "../crates/strip" }
sine-loco-net = { path = "../crates/net" }

# Not part of the main workspace (nightly toolchain, libFuzzer): run with `cargo +nightly fuzz run <target>` from the repository root.
[workspace]

[[bin]]
name = "strip"
path = "fuzz_targets/strip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "formats"
path = "fuzz_targets/formats.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frames"
path = "fuzz_targets/frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tor_parsers"
path = "fuzz_targets/tor_parsers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "handshake"
path = "fuzz_targets/handshake.rs"
test = false
doc = false
bench = false
