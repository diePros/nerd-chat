[workspace]
resolver = "2"
members = ["crates/vault", "crates/core", "crates/exchange", "crates/net", "crates/store", "crates/chat", "crates/strip", "crates/app", "crates/gui", "crates/tui", "crates/sandbox", "crates/android", "crates/android-clean"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Crypto crates are far too slow unoptimized (Argon2 512 MiB, ML-KEM); keep deps fast in dev/test.
[profile.dev.package."*"]
opt-level = 3

# The parsers handle hostile input; keep their tests (incl. mutation fuzzing) fast.
[profile.dev.package.sine-loco-strip]
opt-level = 3

# snow 0.10.0 never wipes key material. vendor/snow is the unmodified crate plus Drop-time zeroization (see vendor/snow/PATCH-NOTES.md).
[patch.crates-io]
snow = { path = "vendor/snow" }
