# Onion site. Listens on loopback only: Tor is the only way in.
server {
    listen 127.0.0.1:8080 default_server;
    server_name _;
    server_tokens off;

    root /srv/sineloco/site;
    index index.html;

    # speed: kernel file copy, precompressed files (no CPU per request)
    sendfile on;
    tcp_nopush on;
    gzip_static on;
    gzip on;
    gzip_types application/json;
    keepalive_timeout 30s;

    # nothing writes through this server
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # the page and its assets: revalidate quickly, fonts never change
    location / {
        include /etc/nginx/snippets/sineloco-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
    location ^~ /fonts/ {
        include /etc/nginx/snippets/sineloco-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ~* \.(css|js|svg)$ {
        include /etc/nginx/snippets/sineloco-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # stars + releases, written by the sync job (same JSON as the clearnet Worker)
    location = /api/github {
        include /etc/nginx/snippets/sineloco-headers.conf;
        alias /srv/sineloco/data/github.json;
        default_type application/json;
        add_header Cache-Control "public, max-age=60" always;
    }

    # downloads page without JavaScript (Tor Browser's Safest mode)
    location = /downloads { return 301 /downloads/; }
    location = /downloads/ {
        include /etc/nginx/snippets/sineloco-headers.conf;
        alias /srv/sineloco/data/downloads/index.html;
        default_type text/html;
        add_header Cache-Control "no-cache" always;
    }

    # the files themselves. No listing; always downloaded, never rendered in the browser.
    location ^~ /dl/ {
        include /etc/nginx/snippets/sineloco-headers.conf;
        alias /srv/sineloco/dl/;
        autoindex off;
        default_type application/octet-stream;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "public, max-age=300" always;
    }
}
