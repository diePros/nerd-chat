[package]
publish = false
name = "sine-loco-android"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Bridge between the Kotlin Android app and sine-loco-app: a command layer over the core's key-driven state machine, a JSON snapshot of its state, and two JNI entry points"

[lib]
name = "sineloco_bridge"
crate-type = ["cdylib", "rlib"]

[dependencies]
sine-loco-app = { path = "../app", default-features = false }
sine-loco-core = { path = "../core" }
sine-loco-net = { path = "../net" }
sine-loco-store = { path = "../store" }
sine-loco-vault = { path = "../vault" }
jni = "0.21"
zeroize = "1"
getrandom = "0.3"

[dev-dependencies]
sine-loco-vault = { path = "../vault", features = ["insecure-test-kdf"] }
tempfile = "3"
