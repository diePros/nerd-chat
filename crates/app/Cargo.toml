[package]
publish = false
name = "sine-loco-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "UI-agnostic application core: the state machine (vault, contacts, pairing, chat engine glue, panic/purge), shared by the terminal and the GUI front ends"

[features]
# the ratatui renderer (the terminal front end turns it on; the GUI does not)
terminal-ui = ["dep:ratatui"]
# lets a front end inject an in-memory test network instead of Tor (developer demo and tests only; never enabled by a release build)
test-transport = []

[dependencies]
sine-loco-core = { path = "../core" }
sine-loco-vault = { path = "../vault" }
sine-loco-store = { path = "../store" }
sine-loco-exchange = { path = "../exchange" }
sine-loco-net = { path = "../net" }
sine-loco-chat = { path = "../chat" }
sine-loco-strip = { path = "../strip" }
sine-loco-sandbox = { path = "../sandbox" }
ratatui = { version = "0.30", optional = true }
zeroize = "1"
getrandom = "0.3"
rustix = { version = "1", features = ["process", "thread", "event", "fs", "time"] }

[dev-dependencies]
ratatui = "0.30"  # the renderer is compiled in the tests so that every screen test runs with and without the `terminal-ui` feature
sine-loco-vault = { path = "../vault", features = ["insecure-test-kdf"] }
tempfile = "3"
