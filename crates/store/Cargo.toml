[package]
publish = false
name = "nerd-chat-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
nerd-chat-core = { path = "../core" }
nerd-chat-vault = { path = "../vault" }
zeroize = "1"
thiserror = "2"
getrandom = "0.3"
libc = "0.2"

[dev-dependencies]
nerd-chat-vault = { path = "../vault", features = ["insecure-test-kdf"] }
tempfile = "3"
