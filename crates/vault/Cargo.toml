[package]
publish = false
name = "sine-loco-vault"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
argon2 = { version = "0.5", features = ["zeroize"] }
blake2 = "0.11"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1", features = ["derive"] }
thiserror = "2"

[features]
# NEVER enable in release builds: adds a trivially weak KDF profile.
insecure-test-kdf = []
