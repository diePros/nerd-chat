[package]
publish = false
name = "sine-loco-android-clean"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The hostile-file cleaner as a tiny library for Android's isolated process: sine-loco-strip behind one JNI call. No keys, no vault, no network code lives in it."

[lib]
name = "sineloco_clean"
crate-type = ["cdylib", "rlib"]

[dependencies]
sine-loco-strip = { path = "../strip" }
jni = "0.21"
zeroize = "1"
