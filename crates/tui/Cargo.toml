[package]
publish = false
name = "nerd-chat-tui"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "nerd-chat"
path = "src/main.rs"

[dependencies]
nerd-chat-app = { path = "../app", features = ["terminal-ui"] }
nerd-chat-core = { path = "../core" }
nerd-chat-vault = { path = "../vault" }
nerd-chat-strip = { path = "../strip" }
nerd-chat-net = { path = "../net" }
nerd-chat-store = { path = "../store" }
ratatui = "0.30"
zeroize = "1"
rustix = { version = "1", features = ["process", "thread", "event"] }
signal-hook = "0.3"

[dev-dependencies]
nerd-chat-vault = { path = "../vault", features = ["insecure-test-kdf"] }
tempfile = "3"
