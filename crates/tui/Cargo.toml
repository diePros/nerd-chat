[package]
publish = false
name = "sine-loco-tui"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "sine-loco"
path = "src/main.rs"

[dependencies]
sine-loco-app = { path = "../app", features = ["terminal-ui"] }
sine-loco-core = { path = "../core" }
sine-loco-vault = { path = "../vault" }
sine-loco-strip = { path = "../strip" }
sine-loco-net = { path = "../net" }
sine-loco-store = { path = "../store" }
ratatui = "0.30"
zeroize = "1"
rustix = { version = "1", features = ["process", "thread", "event"] }
signal-hook = "0.3"

[dev-dependencies]
sine-loco-vault = { path = "../vault", features = ["insecure-test-kdf"] }
tempfile = "3"
