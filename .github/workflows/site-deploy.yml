# Website (sineloco.dev): checks every change under site/, deploys the Worker when main changes.
# Needs one repository secret: CLOUDFLARE_API_TOKEN (see site/README.md). The account ID is in wrangler.jsonc.
# Without it the checks still run and the deploy step is skipped with a notice.
name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site-deploy.yml"]
  pull_request:
    paths: ["site/**", ".github/workflows/site-deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

defaults:
  run:
    working-directory: site

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Types
        run: npx wrangler types && npx tsc --noEmit
      - name: Script syntax
        run: node --check public/app.js
      - name: Package the Worker (no upload)
        run: npx wrangler deploy --dry-run
      - name: Shell scripts (onion mirror, informational)
        continue-on-error: true
        working-directory: .
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S error site/onion/*.sh

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Secrets present?
        id: secrets
        working-directory: .   # runs before checkout, when site/ does not exist yet
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::CLOUDFLARE_API_TOKEN is not set, so the Worker was not deployed."; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secrets.outputs.ok == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - if: steps.secrets.outputs.ok == 'true'
        run: npm ci
      - name: Deploy
        if: steps.secrets.outputs.ok == 'true'
        run: npx wrangler deploy
