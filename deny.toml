# cargo-deny policy (run: cargo deny check). Not yet executed in CI: cargo-deny is not installed here.
[graph]
targets = ["x86_64-unknown-linux-musl"]

[advisories]
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "AGPL-3.0-or-later", "Unlicense", "MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  { name = "openssl" }, { name = "openssl-sys" }, { name = "native-tls" }, { name = "ring" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
