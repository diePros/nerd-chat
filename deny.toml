# cargo-deny policy (run: cargo deny check). First run: cycle 21, advisories/licenses/sources ok.
[graph]
targets = ["x86_64-unknown-linux-musl"]

[advisories]
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "AGPL-3.0-or-later", "Unlicense", "MPL-2.0"]
# egui's bundled default fonts (Hack, Ubuntu-Light, Noto emoji, emoji icons) carry the SIL OFL and the Ubuntu Font Licence: allowed for THAT crate only (GUI, see docs/superpowers/specs/2026-11-09-gui-spike-report.md)
exceptions = [{ name = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true   # our own path crates have no version requirement
deny = [
  { name = "openssl" }, { name = "openssl-sys" }, { name = "native-tls" }, { name = "ring" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
